<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sis Jhessel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23362968'/%3E%3Ctext x='32' y='45' font-family='Helvetica,Arial' font-size='38' font-weight='bold' fill='%23fff' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="/app.css">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          base: '#0F1115',
          superficie: '#1B2029',
          hondo: '#141821',
          borde: '#2A2F3A',
          barra: '#12151C',
          texto: '#EDEFF3',
          titulo: '#F1F5F9',
          apagado: '#8B95A7',
          marca: '#362968',
          azul: '#4C8DFF',
          violeta: '#9B8CFF',
          verde: '#34D399',
          ambar: '#FBBF24',
          cian: '#6EE7F9',
          rosa: '#FB7185'
        },
        fontFamily: {
          display: ['Space Grotesk', 'system-ui', 'sans-serif'],
          cuerpo: ['Inter', 'system-ui', 'sans-serif'],
          datos: ['JetBrains Mono', 'ui-monospace', 'monospace']
        }
      }
    }
  };
</script>
</head>
<body class="bg-base text-texto font-cuerpo antialiased">

<!-- ------------------------------------------------------------------ -->
<!-- Entrada: una pantalla con los cinco accesos de la casa            -->
<!-- ------------------------------------------------------------------ -->
<section id="pantalla-login" class="hidden min-h-dvh flex-col">
  <div class="relative">
    <img src="/img/tienda.jpg" alt="Local Jhessel" class="h-56 w-full object-cover opacity-90 sm:h-72">
    <div class="absolute inset-0 bg-gradient-to-t from-base via-base/60 to-transparent"></div>
    <div class="absolute inset-x-0 bottom-0 p-5">
      <div class="flex items-end gap-3">
        <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-marca font-display text-3xl font-bold text-white shadow-lg shadow-marca/40">J</div>
        <div>
          <h1 class="font-display text-3xl font-bold leading-none text-titulo">JHESEL</h1>
          <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-apagado">Control de ventas</p>
        </div>
      </div>
    </div>
  </div>

  <div class="flex-1 px-4 pb-10">
    <p class="mt-6 text-center text-sm text-apagado">Elegi como vas a entrar</p>

    <div id="lista-tiendas" class="mt-4 grid grid-cols-2 gap-3"></div>

    <button id="boton-dueno" class="tap mt-3 flex w-full items-center justify-center gap-2 rounded-2xl bg-marca py-3.5 font-bold text-white shadow-lg shadow-marca/30">
      <span class="text-xl">🔑</span><span>Dueño</span>
    </button>

    <div id="caja-error-login" class="mt-4 hidden rounded-2xl border border-rosa/30 bg-rosa/10 px-4 py-3 text-sm text-rosa"></div>
  </div>
</section>

<!-- ------------------------------------------------------------------ -->
<!-- Aviso flotante                                                     -->
<!-- ------------------------------------------------------------------ -->
<div id="aviso" class="pointer-events-none fixed inset-x-0 bottom-24 z-[70] hidden px-4">
  <div class="mx-auto max-w-lg rounded-2xl px-4 py-3 text-center text-sm font-semibold shadow-lg"></div>
</div>

<!-- ------------------------------------------------------------------ -->
<!-- Aplicacion                                                         -->
<!-- ------------------------------------------------------------------ -->
<div id="pantalla-app" class="hidden min-h-dvh pb-24">
  <header class="sticky top-0 z-40 border-b border-borde bg-barra/85 backdrop-blur">
    <div class="mx-auto flex max-w-lg items-center justify-between gap-3 px-4 py-3">
      <div class="flex items-center gap-2.5">
        <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-marca font-display text-lg font-bold text-white">J</div>
        <div class="leading-tight">
          <p id="rotulo-tienda" class="font-display text-sm font-bold text-titulo">—</p>
          <p id="rotulo-rol" class="text-[10px] font-semibold uppercase tracking-wider text-apagado">—</p>
        </div>
      </div>
      <button id="boton-salir" class="tap rounded-xl border border-borde bg-superficie px-3 py-2 text-xs font-semibold text-apagado">Salir</button>
    </div>
  </header>

  <main id="contenido" class="mx-auto max-w-lg px-4 py-5"></main>
</div>

<!-- ------------------------------------------------------------------ -->
<!-- Barra de pestanas                                                 -->
<!-- ------------------------------------------------------------------ -->
<nav id="barra-pestanas" class="fixed inset-x-0 bottom-0 z-50 hidden border-t border-borde bg-barra/95 pb-[env(safe-area-inset-bottom)] backdrop-blur">
  <div id="pestanas" class="mx-auto grid max-w-lg"></div>
</nav>

<div id="capa-modal" class="hidden fixed inset-0 z-[60] overflow-y-auto bg-black/70 px-4 py-6 backdrop-blur-sm"></div>

<script src="/app.js"></script>
</body>
</html>
